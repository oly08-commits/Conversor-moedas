<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conversor de Moedas</title>
  </head>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/script.js" defer></script>
  <body>
    <div id="container">
      <div id="title">
        <h1>Conversor de Moedas</h1>
      </div>
      <form action="" id="form">
        <div id="inputs">
          <input
            type="text"
            id="convert"
            class="input"
            placeholder="Inserir valor"
            required
          />
          <select id="coin" class="input">
            <option value="0">Selecionar Moeda</option>
            <option value="1">Kwanza</option>
            <option value="2">USD</option>
            <option value="3">Euro</option>
            <option value="4">Real</option>
          </select>
        </div>
        <div id="values">
          <div id="value" class="input template hide"></div>
        </div>
        <div class="btnDiv">
          <button type="submit" id="btn" class="input">Converter</button>
        </div>
      </form>
    </div>
  </body>
</html>
